<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS static website architecture</title>
  <desc id="desc">Visitors flow through Route 53 and ACM to CloudFront and a private S3 bucket.</desc>
  <rect width="1600" height="900" fill="#111820"/>
  <text x="800" y="150" text-anchor="middle" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="48">&lt;insert_parameter&gt; Website Architecture</text>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
    <g fill="#1d2935" stroke="#f47c3c" stroke-width="5">
      <rect x="90" y="330" width="280" height="170" rx="28"/>
      <rect x="460" y="330" width="280" height="170" rx="28"/>
      <rect x="830" y="330" width="280" height="170" rx="28"/>
      <rect x="1200" y="330" width="280" height="170" rx="28"/>
    </g>
    <g fill="#f7f3ed">
      <text x="230" y="425">Website visitors</text>
      <text x="600" y="405">Route 53 + ACM</text><text x="600" y="445" font-size="22">DNS and TLS</text>
      <text x="970" y="405">CloudFront</text><text x="970" y="445" font-size="22">HTTPS and caching</text>
      <text x="1340" y="405">Private S3</text><text x="1340" y="445" font-size="22">Static assets</text>
    </g>
  </g>
  <g stroke="#f47c3c" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 415h80"/><path d="m430 395 20 20-20 20"/>
    <path d="M740 415h80"/><path d="m800 395 20 20-20 20"/>
    <path d="M1110 415h80"/><path d="m1170 395 20 20-20 20"/>
  </g>
  <text x="800" y="650" text-anchor="middle" fill="#f7f3ed" font-family="Arial, sans-serif" font-size="30">GitHub Actions CI/CD + Terraform infrastructure as code</text>
</svg>

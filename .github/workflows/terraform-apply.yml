name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_subdomain_name: ${{ vars.SUBDOMAIN_NAME }}
  TF_VAR_bucket_name: ${{ vars.WEBSITE_BUCKET_PREFIX }}

jobs:
  apply:
    name: Apply and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform-apply
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: Initialize Terraform
        working-directory: terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate -no-color

      - name: Apply Terraform
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Read deployment targets
        id: infrastructure
        working-directory: terraform
        shell: bash
        run: |
          echo "bucket_name=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend assets
        env:
          WEBSITE_BUCKET: ${{ steps.infrastructure.outputs.bucket_name }}
        run: |
          aws s3 sync frontend "s3://${WEBSITE_BUCKET}" \
            --delete \
            --exclude "projects/project-two.html" \
            --exclude "projects/project-three.html" \
            --cache-control "public,max-age=3600"
          aws s3 cp frontend "s3://${WEBSITE_BUCKET}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --exclude "projects/project-two.html" \
            --exclude "projects/project-three.html" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 rm "s3://${WEBSITE_BUCKET}/projects/project-two.html"
          aws s3 rm "s3://${WEBSITE_BUCKET}/projects/project-three.html"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.infrastructure.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
